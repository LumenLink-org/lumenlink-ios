[package]
name = "lumenlink-ios-ffi"
version = "0.1.0"
edition = "2021"
authors = ["LumenLink Team"]
description = "LumenLink iOS FFI - C ABI bindings for Swift/XCFramework"

[lib]
name = "lumenlink_ios"
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific logging if needed
# os_log bindings

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
